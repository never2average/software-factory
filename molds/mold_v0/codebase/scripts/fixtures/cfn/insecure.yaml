AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  A fixture with known issues (mold_v0-184) - a public, unencrypted bucket, an unencrypted queue and volume,
  a wildcard IAM policy and a security group open to the world, each created in a local emulator and read back.
Parameters:
  Unused:
    Type: String
    Default: nothing
Resources:
  PublicBucket:
    Type: AWS::S3::Bucket
    Properties:
      AccessControl: PublicRead
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
  PlainQueue:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: false
      MessageRetentionPeriod: 345600
  OpenGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: open to the world
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
  PlainVolume:
    Type: AWS::EC2::Volume
    Properties:
      AvailabilityZone: us-east-1a
      Size: 8
      Encrypted: false
  AdminRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: everything
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: '*'
                Resource: '*'
  Unsupported:
    Type: AWS::Pipes::Pipe
    Properties:
      RoleArn: !GetAtt AdminRole.Arn
      Source: !GetAtt PlainQueue.Arn
      Target: !GetAtt PlainQueue.Arn
Outputs:
  BucketName:
    Value: !Ref PublicBucket
