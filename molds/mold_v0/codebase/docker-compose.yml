# Local dev stack: Postgres (config, queue, scores) and ClickHouse (raw transcripts + search).
# All credentials are local-only defaults; do not reuse them anywhere real.
#
#   Postgres         postgres://postgres:postgres@localhost:5432/app
#   ClickHouse HTTP  http://localhost:8123   user app/app, database app

services:
  postgres:
    image: docker.io/postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
      TZ: UTC
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:25.12
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
    ports:
      - 127.0.0.1:8123:8123
    volumes:
      - ./docker/clickhouse/users.d-app.xml:/etc/clickhouse-server/users.d/app.xml:ro
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  clickhouse_data:
